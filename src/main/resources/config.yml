# ═══════════════════════════════════════════════════════════════════════════════
#  Thirst — configuration
#
#  All gameplay numbers live here; nothing is hardcoded. After editing, run
#  /thirst reload (added in a later phase) or restart the server.
#
#  config-version is managed by the plugin for future migrations — do not edit.
# ═══════════════════════════════════════════════════════════════════════════════
config-version: 1

# ─── HUD ──────────────────────────────────────────────────────────────────────
# hud-mode:
#   ACTIONBAR_TEXT        Text thirst bar drawn in the action bar (above the
#                         hotbar). Default. No resource pack required.
#   BOSSBAR              Debug / fallback only. Renders top-centre, not above the
#                         hotbar, so it is not the intended look.
#   ACTIONBAR_RESOURCEPACK  Reserved for a future release: pixel-positioned
#                         droplet glyphs from a resource pack. Falls back to
#                         ACTIONBAR_TEXT if the player declines the pack.
hud-mode: ACTIONBAR_TEXT

# If false (default), the thirst bar yields the action-bar slot to other plugins
# and vanilla: when something else has written to a player's action bar within
# 'hud.yield-window-millis', Thirst skips its own update that tick rather than
# clobbering the message. Set true to always show the thirst bar.
actionbar-overwrite-others: false

# Reserved for the future ACTIONBAR_RESOURCEPACK mode. Ignored otherwise.
resource-pack-url: ""

hud:
  # How often the HUD task refreshes each online player's action bar / boss bar.
  # Action-bar text fades after ~3s (60t), so keep this below ~40 ticks.
  update-interval-ticks: 30
  # BAR     -> "[||||||----]"
  # PERCENT -> "75% Thirst"  (label comes from hud.label below; blank hides it)
  style: BAR
  bar-segments: 10
  # MiniMessage colour tags. Anything MiniMessage accepts works: <blue>, a hex
  # colour like <#4FC3F7>, even a <gradient:...>.
  color-normal: "<aqua>"
  color-critical: "<red>"
  # Bar colour while the player has any Salmonella stacks (overrides both of the
  # above). Neon green.
  color-infected: "<color:#39FF14>"
  # Append " ☣<n>" (stack count) to the bar while infected.
  salmonella-indicator: true
  # Text shown next to the percent (PERCENT style only). Blank hides it.
  label: "Thirst"

  # Show text from another plugin on the same action-bar line as the thirst bar,
  # so the two don't fight over the slot. Requires PlaceholderAPI (Thirst still
  # runs fine without it — this section is just ignored). ACTIONBAR modes only.
  #
  # RealisticSeasons example — in RealisticSeasons' own config set
  # display -> temperature -> actionbar: false, then here:
  #   enabled: true
  #   placeholder: "%rs_temperaturecolor%%rs_temperature%"
  external-segment:
    enabled: false
    # Any PlaceholderAPI string. Legacy colour codes (& or §) in the result are
    # honoured.
    placeholder: ""
    # true  -> "<external> | [||||||----]"
    # false -> "[||||||----] | <external>"
    place-before: true
    # MiniMessage, shown between the external text and the thirst bar.
    separator: " <white>|</white> "
  # Default duration (ms) used when another plugin calls
  # ThirstHudTask#requestActionBarYield(player) with no explicit duration.
  #
  # IMPORTANT: Paper has no public API to detect an arbitrary plugin's outgoing
  # action-bar packets, so "actionbar-overwrite-others: false" cannot
  # automatically notice a third-party plugin using the slot — only Thirst's
  # own updates are something we control. What it *does* do is honour a
  # cooperative request: another plugin can call
  # ThirstHudTask#requestActionBarYield(Player[, millis]) to ask Thirst to back
  # off for a moment before it sends its own text. See README.
  yield-window-millis: 3000

# ─── Water quality ────────────────────────────────────────────────────────────
# Quality of any chunk an admin has not explicitly painted. FRESH | NEUTRAL | DIRTY
#   FRESH   — safe, restores the most thirst
#   NEUTRAL — no established quality (the sensible default for land with no
#             natural water)
#   DIRTY   — restores the least, can cause Salmonella
# Per-chunk overrides are stored in water_quality.db (SQLite) in the plugin
# folder, loaded into memory on startup and written back asynchronously.
#
# Commands (permission thirst.admin.water):
#   /water get                                       quality of the chunk you're in
#   /water setchunk <fresh|neutral|dirty>            paint the chunk you're standing in
#   /water setregion <fresh|neutral|dirty> <x1> <z1> <x2> <z2> [world]
#                                                    bulk-paint a block-coord rectangle
default-water-quality: NEUTRAL

water:
  # When an unpainted chunk is first checked, scan it for surface water:
  #   has water -> natural-water-quality (below)
  #   no water  -> default-water-quality (above)
  # Scanned once per chunk per session and cached — it will NOT notice water
  # added to a previously-dry chunk until the next restart. A painted chunk is
  # never touched (detection is read-only). Turn off to use
  # default-water-quality for every unpainted chunk.
  detect-water: true
  natural-water-quality: DIRTY
  # Safety cap on /water setregion — the command is rejected if the rectangle
  # covers more chunk columns than this.
  max-region-chunks: 50000
  # Remember the quality of water poured out of a tagged bucket (and of water
  # that flows from it), so scooping it back up keeps that quality. Without
  # this, dirty water could be turned fresh by pouring it out in a fresh chunk
  # and scooping it up again. Stored in water_quality.db.
  track-placed-water: true
  # Most poured-water blocks remembered. Past this the oldest are dropped (and
  # a warning is logged once), so very old poured water takes on its chunk's
  # quality again.
  tracked-block-limit: 100000
  # How often (seconds) tracked blocks are checked for having dried up or been
  # removed, and pending changes are saved. Applied on /thirst reload.
  placed-water-prune-seconds: 30

# ─── Thirst mechanics ─────────────────────────────────────────────────────────
thirst:
  # Internal scale, mirrors vanilla hunger (0–20). Displayed as a bar / percent.
  max: 20
  # Seconds of pure idle time to lose 1 thirst point with zero exhaustion.
  base-drain-interval-seconds: 120

  # Below this % of max, the HUD turns red (see hud.color-critical). Default
  # matches vanilla hunger's own "sprint disabled" cutoff: hunger level 6/20 = 30%.
  critical-threshold-percent: 30
  # At/below critical-threshold-percent, make sprinting pointless (a true
  # "can't sprint" isn't possible from the server — the client decides whether
  # to sprint). Two effects, both only while the player is actually sprinting:
  #   * movement speed is cut to critical-sprint-speed-multiplier (below), so
  #     sprinting is no faster than walking; normal walking is unaffected.
  #   * jumping is blocked entirely — otherwise the sprint-jump lunge (a
  #     client-side velocity kick the server can't dampen) lets you bunny-hop
  #     around at speed. Let go of sprint and jumping works normally.
  disable-sprint-when-critical: true
  # Movement-speed multiplier applied only while sprinting AND critical.
  # 0.75 ≈ sprint no faster than a walk; lower = sprinting is slower than
  # walking. Range 0.1–1.0 (1.0 disables the speed part).
  critical-sprint-speed-multiplier: 0.75

  # Damage taken while at 0 thirst.
  starvation-damage-enabled: true
  starvation-damage-amount: 1.0
  starvation-damage-interval-seconds: 4
  # Like vanilla hunger: starvation will not reduce health below this value
  # (vanilla uses 1.0 on Easy, 0.0 on Hard). Set to 0.0 to allow death anywhere.
  starvation-minimum-health: 1.0

  # Exhaustion model — mirrors vanilla hunger. Exhaustion accumulates from the
  # actions below; every time it crosses 'exhaustion-threshold' the player loses
  # 1 thirst point and the counter resets by that amount.
  exhaustion-threshold: 4.0
  exhaustion:
    per-sprint-meter: 0.1
    per-walk-meter: 0.0
    per-swim-meter: 0.015
    jump: 0.05
    sprint-jump: 0.2
    attack: 0.1
    break-block: 0.005
    take-damage: 0.1
    # Applied once per second to any player in the Nether (dry, hot).
    nether-per-second: 0.05

# ─── Drinking ─────────────────────────────────────────────────────────────────
# Drinking is bottle-based only. Fill an empty glass bottle at a water source
# block (or a water cauldron) to get a "Bottle of Freshwater" or "Bottle of
# Dirty Water" — the bottle is tagged with the quality of the chunk it was
# filled in. Drink that bottle later to restore thirst. There is no
# drink-straight-from-the-block interaction.
drinking:
  # Minimum ticks between drinks (enforced server-side — the drink is refused
  # if you last drank within this window).
  cooldown-ticks: 40
  fresh-water-restore-amount: 4
  neutral-water-restore-amount: 3
  dirty-water-restore-amount: 2
  # Chance (0.0–1.0) that drinking a Dirty Water bottle causes / stacks Salmonella.
  # (FRESH and NEUTRAL water never cause it.)
  salmonella-chance: 0.65
  # A cauldron holds the quality of whatever was poured in — a tagged bucket or
  # bottle carries its quality across; rain / dripstone fills it with dirty
  # runoff (gated by this flag). Any dirty part makes the whole pot dirty.
  # Tracked in memory; resets on restart.
  rain-cauldron-always-dirty: true
  # While a world has active rain/storm, every water source there fills DIRTY,
  # regardless of the chunk's quality. Reverts as soon as the weather clears.
  # Bottles / buckets already filled keep whatever quality they were filled with.
  dirty-while-raining: true
  # Item names for the filled containers (MiniMessage).
  fresh-bottle-name: "<aqua>Bottle of Freshwater"
  neutral-bottle-name: "<gray>Bottle of Water"
  dirty-bottle-name: "<color:#8a7f4a>Bottle of Dirty Water"
  fresh-bucket-name: "<aqua>Bucket of Freshwater"
  neutral-bucket-name: "<gray>Bucket of Water"
  dirty-bucket-name: "<color:#8a7f4a>Bucket of Dirty Water"

# ─── Salmonella (dirty-water illness) ─────────────────────────────────────────
# A stacking illness from drinking DIRTY water (chance = drinking.salmonella-chance).
# Effects escalate by stack (code-defined, following the spec table). Only the
# worst stack (5) amplifies to level II — earlier stacks just add more level-I
# effects rather than stronger ones. Nausea (screen wobble) doesn't start
# until nausea-from-stack, since — unlike the other effects — its amplifier
# doesn't change its intensity in vanilla, only when it shows up does:
#   1  Slowness I
#   2  Slowness I + Weakness I
#   3  Slowness I + Weakness I + Nausea I   (+ occasional vomit)
#   4  Slowness I + Weakness I + Nausea I   (+ periodic damage)
#   5  Slowness I + Weakness II + Nausea II (+ lethal damage)
# Drinking dirty water while infected adds a stack (max 5) and resets the decay
# timer. The HUD bar turns neon green (hud.color-infected) while infected.
salmonella:
  # A stack decays by 1 each time this many seconds pass without a new infection.
  decay-interval-seconds: 300
  # Potion-effect duration (seconds) applied per stack level 1..5 — refreshed
  # every second, so this is really "how long the effects linger after a
  # relog / plugin stop".
  stack-durations-seconds: [30, 45, 60, 90, 120]
  # Drinking a milk bucket has a chance to remove stacks instantly.
  cure-with-milk: true
  # Chance (0.0-1.0) that a milk bucket cures anything at all. Only rolled
  # while actually infected, so healthy players drinking milk see nothing.
  milk-cure-chance: 0.3
  # On a successful roll, how many stacks it removes.
  milk-cure-stacks: 1
  # From this stack level, Nausea (screen wobble) starts. Below it you only get
  # Slowness/Weakness — Nausea's amplifier doesn't change its intensity in
  # vanilla, so this is the only real dial on "how much shake".
  nausea-from-stack: 3
  # From this stack level, occasional cosmetic vomit particle + sound.
  vomit-from-stack: 3
  damage:
    # From this stack level, take damage every 'interval-seconds'.
    from-stack: 4
    amount: 1.0
    interval-seconds: 5
    # From this stack level the damage can kill (below it, it stops at 1 HP).
    lethal-from-stack: 5
