# ═══════════════════════════════════════════════════════════════════════════════
#  Thirst — configuration
#
#  All gameplay numbers live here; nothing is hardcoded. After editing, run
#  /thirst reload (added in a later phase) or restart the server.
#
#  config-version is managed by the plugin for future migrations — do not edit.
# ═══════════════════════════════════════════════════════════════════════════════
config-version: 1

# ─── HUD ──────────────────────────────────────────────────────────────────────
# hud-mode:
#   ACTIONBAR_TEXT        Text thirst bar drawn in the action bar (above the
#                         hotbar). Default. No resource pack required.
#   BOSSBAR              Debug / fallback only. Renders top-centre, not above the
#                         hotbar, so it is not the intended look.
#   ACTIONBAR_RESOURCEPACK  Reserved for a future release: pixel-positioned
#                         droplet glyphs from a resource pack. Falls back to
#                         ACTIONBAR_TEXT if the player declines the pack.
hud-mode: ACTIONBAR_TEXT

# If false (default), the thirst bar yields the action-bar slot to other plugins
# and vanilla: when something else has written to a player's action bar within
# 'hud.yield-window-millis', Thirst skips its own update that tick rather than
# clobbering the message. Set true to always show the thirst bar.
actionbar-overwrite-others: false

# Reserved for the future ACTIONBAR_RESOURCEPACK mode. Ignored otherwise.
resource-pack-url: ""

hud:
  # How often the HUD task refreshes each online player's action bar / boss bar.
  # Action-bar text fades after ~3s (60t), so keep this below ~40 ticks.
  update-interval-ticks: 30
  # BAR     -> "[||||||----]"
  # PERCENT -> "75% Thirst"  (label comes from hud.label below; blank hides it)
  style: BAR
  bar-segments: 10
  # MiniMessage colour tags. Anything MiniMessage accepts works: <blue>, a hex
  # colour like <#4FC3F7>, even a <gradient:...>.
  color-normal: "<aqua>"
  color-critical: "<red>"
  # Text shown next to the percent (PERCENT style only). Blank hides it.
  label: "Thirst"

  # Show text from another plugin on the same action-bar line as the thirst bar,
  # so the two don't fight over the slot. Requires PlaceholderAPI (Thirst still
  # runs fine without it — this section is just ignored). ACTIONBAR modes only.
  #
  # RealisticSeasons example — in RealisticSeasons' own config set
  # display -> temperature -> actionbar: false, then here:
  #   enabled: true
  #   placeholder: "%rs_temperaturecolor%%rs_temperature%"
  external-segment:
    enabled: false
    # Any PlaceholderAPI string. Legacy colour codes (& or §) in the result are
    # honoured.
    placeholder: ""
    # true  -> "<external> | [||||||----]"
    # false -> "[||||||----] | <external>"
    place-before: true
    # MiniMessage, shown between the external text and the thirst bar.
    separator: " <white>|</white> "
  # Default duration (ms) used when another plugin calls
  # ThirstHudTask#requestActionBarYield(player) with no explicit duration.
  #
  # IMPORTANT: Paper has no public API to detect an arbitrary plugin's outgoing
  # action-bar packets, so "actionbar-overwrite-others: false" cannot
  # automatically notice a third-party plugin using the slot — only Thirst's
  # own updates are something we control. What it *does* do is honour a
  # cooperative request: another plugin can call
  # ThirstHudTask#requestActionBarYield(Player[, millis]) to ask Thirst to back
  # off for a moment before it sends its own text. See README.
  yield-window-millis: 3000

# ─── Water quality ────────────────────────────────────────────────────────────
# Quality of any chunk an admin has not explicitly painted. CLEAN | DIRTY
default-water-quality: DIRTY

water:
  # Chunk-outline particle preview shown while using the water-quality wand
  # (optional feature, later phase).
  wand-enabled: true
  wand-material: BLAZE_ROD

# ─── Thirst mechanics ─────────────────────────────────────────────────────────
thirst:
  # Internal scale, mirrors vanilla hunger (0–20). Displayed as a bar / percent.
  max: 20
  # Seconds of pure idle time to lose 1 thirst point with zero exhaustion.
  base-drain-interval-seconds: 120

  # Below this % of max, the HUD turns red (see hud.color-critical). Default
  # matches vanilla hunger's own "sprint disabled" cutoff: hunger level 6/20 = 30%.
  critical-threshold-percent: 30
  # At/below critical-threshold-percent, make sprinting pointless (a true
  # "can't sprint" isn't possible from the server — the client decides whether
  # to sprint). Two effects, both only while the player is actually sprinting:
  #   * movement speed is cut to critical-sprint-speed-multiplier (below), so
  #     sprinting is no faster than walking; normal walking is unaffected.
  #   * jumping is blocked entirely — otherwise the sprint-jump lunge (a
  #     client-side velocity kick the server can't dampen) lets you bunny-hop
  #     around at speed. Let go of sprint and jumping works normally.
  disable-sprint-when-critical: true
  # Movement-speed multiplier applied only while sprinting AND critical.
  # 0.75 ≈ sprint no faster than a walk; lower = sprinting is slower than
  # walking. Range 0.1–1.0 (1.0 disables the speed part).
  critical-sprint-speed-multiplier: 0.75

  # Damage taken while at 0 thirst.
  starvation-damage-enabled: true
  starvation-damage-amount: 1.0
  starvation-damage-interval-seconds: 4
  # Like vanilla hunger: starvation will not reduce health below this value
  # (vanilla uses 1.0 on Easy, 0.0 on Hard). Set to 0.0 to allow death anywhere.
  starvation-minimum-health: 1.0

  # Exhaustion model — mirrors vanilla hunger. Exhaustion accumulates from the
  # actions below; every time it crosses 'exhaustion-threshold' the player loses
  # 1 thirst point and the counter resets by that amount.
  exhaustion-threshold: 4.0
  exhaustion:
    per-sprint-meter: 0.1
    per-walk-meter: 0.0
    per-swim-meter: 0.015
    jump: 0.05
    sprint-jump: 0.2
    attack: 0.1
    break-block: 0.005
    take-damage: 0.1
    # Applied once per second to any player in the Nether (dry, hot).
    nether-per-second: 0.05

# ─── Drinking ─────────────────────────────────────────────────────────────────
# Drinking is bottle-based only. Fill an empty glass bottle at a water source
# block (or a water cauldron) to get a "Bottle of Clean Water" or "Bottle of
# Dirty Water" — the bottle is tagged with the quality of the chunk it was
# filled in. Drink that bottle later to restore thirst. There is no
# drink-straight-from-the-block interaction.
drinking:
  cooldown-ticks: 40
  clean-water-restore-amount: 4
  dirty-water-restore-amount: 2
  # Chance (0.0–1.0) that drinking a Dirty Water bottle causes / stacks Salmonella.
  salmonella-chance: 0.35
  # Water drawn from a cauldron filled by rain is always CLEAN, regardless of the
  # chunk's quality flag.
  rain-cauldron-always-clean: true

  # Optional stretch goal: standing in rain slowly restores thirst.
  rain-trickle-enabled: false
  rain-trickle-amount: 1
  rain-trickle-interval-seconds: 20

# ─── Salmonella (dirty-water illness) ─────────────────────────────────────────
salmonella:
  # A stack decays by 1 each time this many seconds pass without drinking dirty
  # water.
  decay-interval-seconds: 300
  # Effect duration (seconds) applied/refreshed at each stack level 1..5.
  # Drinking dirty water while infected adds a stack (max 5) and refreshes the
  # duration to the value for the new level — it does not add durations.
  stack-durations-seconds: [30, 45, 60, 90, 120]
  # A milk bucket removes 1 stack instantly.
  cure-with-milk: true
