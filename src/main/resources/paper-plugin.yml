name: Thirst
version: '${version}'
main: io.github.itskorvael.thirst.ThirstPlugin
loader: io.github.itskorvael.thirst.ThirstPluginLoader
api-version: '26.1'
description: Adds a thirst mechanic that runs alongside vanilla hunger.
authors:
  - Antonio
website: https://github.com/itskorvael/Thirst

# Optional: used only by hud.external-segment. Thirst loads and runs fine
# without it.
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

# Commands are registered at runtime through the Paper/Brigadier lifecycle API
# (added in a later phase), so they are intentionally not declared here.

permissions:
  thirst.admin:
    description: Grants all Thirst administrative commands.
    default: op
    children:
      thirst.admin.thirst: true
      thirst.admin.water: true
  thirst.admin.thirst:
    description: Manage any player's thirst / Salmonella state and reload the plugin.
    default: op
  thirst.admin.water:
    description: Paint per-chunk water quality (delegable to world builders).
    default: op
  thirst.command.thirst:
    description: Check your own thirst / Salmonella status with /thirst get.
    default: true
